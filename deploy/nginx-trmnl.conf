# /etc/nginx/snippets/nginx-trmnl.conf (or include from sites-available)
# TRMNL Private Plugin poll JSON on crearec.app (public)
#   https://crearec.app/trmnl              → poll JSON
#   https://crearec.app/trmnl/health       → health
#   https://crearec.app/trmnl/poll         → poll JSON (alias)
#
# Studio is NOT proxied publicly. Use Tailscale only:
#   http://100.118.169.52:8799/studio/
#
# After deploying an updated snippet on Debian:
#   sudo cp deploy/nginx-trmnl.conf /etc/nginx/snippets/nginx-trmnl.conf
#   sudo nginx -t && sudo systemctl reload nginx

location = /trmnl/health {
    proxy_pass http://127.0.0.1:8799/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

location = /trmnl/poll {
    proxy_pass http://127.0.0.1:8799/poll;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

location = /trmnl/ {
    return 301 /trmnl;
}

location = /trmnl {
    proxy_pass http://127.0.0.1:8799/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}
