# /etc/nginx/snippets/nginx-trmnl.conf (or include from sites-available)
# TRMNL Private Plugin poll JSON on crearec.app
#   https://crearec.app/trmnl        → poll JSON
#   https://crearec.app/trmnl/health → health

location = /trmnl/health {
    proxy_pass http://127.0.0.1:8799/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

location = /trmnl/ {
    return 301 /trmnl;
}

location = /trmnl {
    proxy_pass http://127.0.0.1:8799/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}
