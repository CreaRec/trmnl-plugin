# /etc/nginx/snippets/nginx-trmnl.conf (or include from sites-available)
# TRMNL Private Plugin poll JSON on crearec.app (public-but-secret UUID token)
#   https://crearec.app/trmnl/<uuid>   → poll JSON (authorized)
#   https://crearec.app/trmnl/health   → health (open)
#   https://crearec.app/trmnl/poll     → backend /poll (401 without ?token=)
#   Bare https://crearec.app/trmnl     → 401 (no unauthenticated poll)
#
# Studio is NOT proxied publicly. Use Tailscale only:
#   http://100.118.169.52:8799/studio/
#
# After deploying an updated snippet on Debian:
#   sudo cp deploy/nginx-trmnl.conf /etc/nginx/snippets/nginx-trmnl.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Also set TRMNL_POLL_TOKEN=<uuid> in /home/crearec/trmnl-plugin/.env and recreate the container.

location = /trmnl/health {
    proxy_pass http://127.0.0.1:8799/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

# Optional alias: /trmnl/poll?token=<uuid> → Node /poll?token=…
# Without a valid token the Node app returns 401 {"error":"unauthorized"}.
location = /trmnl/poll {
    proxy_pass http://127.0.0.1:8799/poll;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

# Primary public poll URL: /trmnl/<uuid> → /poll/<uuid>
# Quote the regex: unquoted {36} is parsed as an nginx block and fails nginx -t (PCRE).
location ~ "^/trmnl/([0-9a-fA-F-]{36})$" {
    proxy_pass http://127.0.0.1:8799/poll/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

# No unauthenticated poll on bare /trmnl (only /trmnl/<uuid> works publicly)
location = /trmnl/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"unauthorized"}';
}

location = /trmnl {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"unauthorized"}';
}
