# /etc/nginx/snippets/nginx-trmnl.conf (or include from sites-available)
# TRMNL Private Plugin poll JSON + Studio layout playground on crearec.app
#   https://crearec.app/trmnl              → poll JSON
#   https://crearec.app/trmnl/health       → health
#   https://crearec.app/trmnl/poll         → poll JSON (alias)
#   https://crearec.app/trmnl/studio       → Studio UI (+ /layout API, static assets)
#
# After deploying an updated snippet on Debian:
#   sudo cp deploy/nginx-trmnl.conf /etc/nginx/snippets/nginx-trmnl.conf
#   sudo nginx -t && sudo systemctl reload nginx

location = /trmnl/health {
    proxy_pass http://127.0.0.1:8799/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

location = /trmnl/poll {
    proxy_pass http://127.0.0.1:8799/poll;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

# Studio: exact path without slash → trailing slash (relative CSS/JS)
location = /trmnl/studio {
    return 301 /trmnl/studio/;
}

# Studio UI, static assets, and /trmnl/studio/layout API
location /trmnl/studio/ {
    proxy_pass http://127.0.0.1:8799/studio/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}

location = /trmnl/ {
    return 301 /trmnl;
}

location = /trmnl {
    proxy_pass http://127.0.0.1:8799/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cache-Control "no-store";
    add_header Cache-Control "no-store" always;
}
