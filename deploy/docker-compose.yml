# Deploy copy for Debian host (/home/crearec/trmnl-plugin).
# Publish on loopback (nginx → /trmnl poll) and Tailscale IP (Studio UI).
# Hardcoded host Tailscale IP 100.118.169.52 — Studio: http://100.118.169.52:8799/studio/
# Create /home/crearec/trmnl-plugin/.env out-of-band (CALENDAR_ICS_URL, weather vars).
# Persist Studio layout JSON via ./data volume (STUDIO_LAYOUT_PATH).
services:
  trmnl-plugin:
    image: ghcr.io/crearec/trmnl-plugin:main
    container_name: trmnl-plugin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8799:8799"
      - "100.118.169.52:8799:8799"
    env_file:
      - .env
    environment:
      - PORT=8799
      - HOST=0.0.0.0
      - STUDIO_LAYOUT_PATH=/app/data/studio-layout.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8799/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
