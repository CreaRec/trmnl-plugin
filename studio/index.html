<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CreaFridge Studio</title>
    <link rel="stylesheet" href="./studio.css" />
    <script>
      /* Probe TRMNL framework CSS; keep preview usable if CDN fails. */
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://trmnl.com/css/latest/plugins.css";
        link.onload = function () {
          document.documentElement.classList.add("has-trmnl-css");
        };
        link.onerror = function () {
          document.documentElement.classList.add("no-trmnl-css");
        };
        document.head.appendChild(link);
        var js = document.createElement("script");
        js.src = "https://trmnl.com/js/latest/plugins.js";
        js.async = true;
        js.onerror = function () {
          /* optional */
        };
        document.head.appendChild(js);
      })();
    </script>
  </head>
  <body>
    <header class="studio-chrome">
      <div class="studio-brand">
        <span class="studio-brand__name">CreaFridge</span>
        <span class="studio-brand__sub">Studio</span>
      </div>
      <p class="studio-lede">
        Preview matches TRMNL Full markup (<code>markup/full.liquid</code>) —
        framework classes inside the 800×480 screen. Reorder via the side rail;
        order saves in localStorage and can sync to the server.
      </p>
      <div class="studio-actions" role="toolbar" aria-label="Layout actions">
        <button type="button" id="btn-save-local">Save locally</button>
        <button type="button" id="btn-sync-server" class="primary">
          Sync to server
        </button>
        <button type="button" id="btn-load-server">Load from server</button>
        <button type="button" id="btn-reset">Reset default</button>
        <button type="button" id="btn-refresh-poll">Refresh poll</button>
      </div>
      <p id="studio-status" class="studio-status" aria-live="polite"></p>
      <p id="updated-label" class="studio-updated" aria-live="polite"></p>
    </header>

    <main class="studio-main">
      <section class="preview-wrap" aria-label="TRMNL OG preview">
        <div class="preview-stage">
          <aside
            id="block-rail"
            class="studio-rail"
            aria-label="Reorder blocks"
          ></aside>
          <div class="preview-frame">
            <div
              id="screen"
              class="screen screen--color-4bwry studio-screen"
              data-studio-screen
            >
              <div
                id="screen-body"
                class="layout layout--col gap--medium"
                aria-label="Screen content"
              ></div>
              <div id="title-bar" class="title_bar">
                <img
                  class="image image--adaptive"
                  alt=""
                  src="https://trmnl.com/images/plugins/weather--render.svg"
                />
                <span class="title" id="title-bar-title">CreaFridge</span>
                <span class="instance" id="title-bar-instance">My Plugin</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./studio.js" type="module"></script>
  </body>
</html>
