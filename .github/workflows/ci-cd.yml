name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/crearec/trmnl-plugin
  DEPLOY_DIR: /home/crearec/trmnl-plugin

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      compose: ${{ steps.filter.outputs.compose }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'Dockerfile'
              - 'test/**'
              - 'vitest.config.ts'
            compose:
              - 'docker-compose.yml'
              - 'deploy/docker-compose.yml'
            ci:
              - '.github/workflows/ci-cd.yml'

  test:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.app == 'true'

      - name: Build image (no push)
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:main,${{ env.IMAGE }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes, publish]
    if: >-
      always()
      && !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.test.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'push'
          && (
            needs.changes.outputs.app == 'true'
            || needs.changes.outputs.compose == 'true'
            || needs.changes.outputs.ci == 'true'
          )
        )
      )
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy compose pull/up
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SERVER_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${SSH[@]}" "$SSH_TARGET" "mkdir -p '${DEPLOY_DIR}'"
          # Prefer deploy/docker-compose.yml (loopback bind) when present
          if [ -f deploy/docker-compose.yml ]; then
            "${SCP[@]}" deploy/docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"
          else
            "${SCP[@]}" docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"
          fi

          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "$SSH_TARGET" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          "${SSH[@]}" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_DIR}'
          docker compose pull
          docker compose up -d
          docker compose ps
          if [ '${APP_CHANGED}' = 'true' ]; then
            docker compose logs --tail=30 trmnl-plugin || true
          fi
          docker logout ghcr.io || true
          EOF

  ghcr_cleanup:
    runs-on: ubuntu-latest
    needs: [publish]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
    concurrency:
      group: ghcr-cleanup-trmnl-plugin
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune trmnl-plugin (keep 10 sha-*)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: trmnl-plugin
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true
